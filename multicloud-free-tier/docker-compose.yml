services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcp}
      POSTGRES_DB: ${POSTGRES_DB:-multicloud}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: ./api
    command: ["bash", "bin/entrypoint.sh", "flask", "--app", "app:create_app", "run", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file: ./api/.env
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./terraform:/terraform

  worker:
    build: ./api
    command: ["bash", "bin/wait-for-pg.sh", "bash", "bin/worker.sh"]
    env_file: ./api/.env
    depends_on:
      - postgres
    volumes:
      - ./api:/app
      - ./terraform:/terraform

  sweeper:
    build: ./api
    command: ["bash", "bin/wait-for-pg.sh", "bash", "bin/sweeper.sh"]
    env_file: ./api/.env
    depends_on:
      - postgres
    volumes:
      - ./api:/app
      - ./terraform:/terraform

volumes:
  pgdata:
