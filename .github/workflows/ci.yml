name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test deps
        run: python -m pip install pytest -r study-brainrot-generator/requirements.txt
      - name: Run self-healing-deployment smoke tests
        run: pytest -q self-healing-deployment/tests/test_smoke.py
      - name: Run study-brainrot-generator smoke tests
        run: pytest -q study-brainrot-generator/tests/test_smoke.py
      - name: Compile-check all Python files
        run: python -m compileall -q browser-pdf-tools doc2md-action/src multicloud-free-tier/api self-healing-deployment study-brainrot-generator/scripts
      - name: Syntax-check JS files
        run: |
          node --check browser-pdf-tools/app.js
          node --check doc2md-action/site/app.js
          node --check multicloud-free-tier/api/app/static/app.js
      - name: ShellCheck scripts
        run: |
          shellcheck \
            minecraft-server-gitops/scripts/*.sh \
            minecraft-server-gitops/scripts/runtime/*.sh \
            multicloud-free-tier/api/bin/*.sh \
            self-healing-deployment/scripts/*.sh
