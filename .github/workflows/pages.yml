name: Deploy DevShed Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage unified Pages artifact
        run: |
          mkdir -p _site/shared _site/panels _site/browser-pdf-tools _site/doc2md-action/site _site/self-healing-deployment/dashboard _site/self-healing-deployment/deployment_log _site/minecraft-server-gitops/config
          cp index.html _site/
          cp -r shared/* _site/shared/
          cp -r panels/* _site/panels/
          cp browser-pdf-tools/index.html browser-pdf-tools/app.js browser-pdf-tools/style.css _site/browser-pdf-tools/
          cp -r doc2md-action/site/* _site/doc2md-action/site/
          cp -r self-healing-deployment/dashboard/* _site/self-healing-deployment/dashboard/
          cp -r self-healing-deployment/deployment_log/* _site/self-healing-deployment/deployment_log/
          cp -r minecraft-server-gitops/config/* _site/minecraft-server-gitops/config/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
