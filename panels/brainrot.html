<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Brainrot Generator — DevShed</title>
  <style>
    :root { color-scheme: dark light; --bg:#0b0f17; --card:#121826; --border:#243047; --text:#e6edf7; --muted:#93a4bf; --accent:#3b82f6; }
    @media (prefers-color-scheme: light) { :root { --bg:#f6f8fb; --card:#fff; --border:#dbe2ee; --text:#0f172a; --muted:#475569; --accent:#2563eb; } }
    body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); padding:2rem; max-width:920px; margin-inline:auto; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; margin-bottom:1rem; }
    h1 { margin-top:0; } p { color:var(--muted); line-height:1.5; }
    input { width:100%; padding:0.6rem 0.75rem; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.95rem; margin-bottom:0.75rem; }
    pre { background:var(--bg); border:1px solid var(--border); padding:0.9rem; border-radius:8px; overflow:auto; font-size:0.85rem; }
    a.btn { display:inline-block; padding:0.5rem 0.9rem; border-radius:8px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; font-size:0.875rem; margin-right:0.5rem; }
  </style>
</head>
<body>
  <h1>Study Brainrot Generator</h1>
  <p>Generate short vertical captioned study videos from Wikipedia articles using bundled background clips and TTS.</p>
  <div class="card">
    <h3>CLI Command Builder</h3>
    <label for="topic">Wikipedia Topic</label>
    <input id="topic" type="text" value="TCP/IP" placeholder="Enter any topic..." />
    <pre id="cmd"></pre>
    <a class="btn" href="https://github.com/Srinivasan-78/devshed/tree/main/study-brainrot-generator" target="_blank" rel="noopener">Browse Source in DevShed ↗</a>
    <a class="btn" href="https://github.com/Srinivasan-78/devshed/tree/main/study-brainrot-generator/.github/workflows" target="_blank" rel="noopener">View GitHub Action ↗</a>
  </div>
  <script>
    const topic = document.getElementById("topic");
    const cmd = document.getElementById("cmd");
    function update() {
      const t = (topic.value || "TCP/IP").replace(/"/g, '\\"');
      cmd.textContent = `cd study-brainrot-generator\npip install -r requirements.txt\npython main.py --topic "${t}"`;
    }
    topic.addEventListener("input", update);
    update();
  </script>
</body>
</html>
